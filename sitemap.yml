# .github/workflows/sitemap.yml
# Régénère sitemap.xml + robots.txt à chaque push sur main, puis les commit.
name: Générer le sitemap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer sitemap.xml + robots.txt
        run: node generate-sitemap.mjs

      - name: Commit si changement
        run: |
          git config user.name  "sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "Aucun changement de sitemap."
          else
            git commit -m "chore: mise à jour du sitemap [skip ci]"
            git push
          fi
