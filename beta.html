<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="portal/logo-mark.png" />
<title>Team Foundation.immo — Portail Conseiller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400..500&family=Hanken+Grotesk:wght@300..700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5f1e8;
  --canvas:#f0eadd;
  --surface:#fdfbf6;
  --surface-2:#f2ede1;
  --ink:#14201e;
  --ink-soft:#46524f;
  --ink-mute:#8b938e;
  --pine:#0d4f4a;
  --pine-deep:#0a3d39;
  --glacier:#7fb5ad;
  --line:#e7e0d0;
  --line-strong:#cdc4b0;
  --accent:#b07d3f;
  --accent-ink:#8c5e25;
  --accent-soft:rgba(176,125,63,.12);
  --accent-line:rgba(176,125,63,.28);
  --ph-base:#e9e3d5;
  --ph-stripe:rgba(13,79,74,.07);
  --ph-text:#8a7d63;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,monospace;
  --topbar-h:68px;
  --shadow-sm:0 1px 2px rgba(20,32,30,.04);
  --shadow-md:0 6px 24px -10px rgba(20,32,30,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--canvas);
  color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
input,select{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft)}

/* ---------- APP SHELL ---------- */
.tf-app{display:flex;min-height:100vh}
.tf-sidebar{
  width:258px;flex-shrink:0;background:var(--pine-deep);color:#f5f1e8;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:26px 18px 22px;z-index:40;
}
.tf-brand{padding:2px 8px 6px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center}
.tf-logo{width:188px;max-width:100%;height:auto;display:block}
.tf-brand-exp{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,241,232,.5)}
.tf-nav{display:flex;flex-direction:column;gap:4px;margin-top:34px}
.tf-nav-item{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:11px 13px;border-radius:9px;border:none;background:transparent;
  color:rgba(245,241,232,.72);font-size:.92rem;font-weight:500;cursor:pointer;
  transition:background .18s,color .18s;
}
.tf-nav-item:hover{background:rgba(245,241,232,.07);color:#f5f1e8}
.tf-nav-item.on{background:rgba(245,241,232,.12);color:#fff}
.tf-nav-item.on svg{color:var(--glacier)}
.tf-side-foot{margin-top:auto;padding-top:18px;border-top:1px solid rgba(245,241,232,.12)}
.tf-side-user{display:flex;align-items:center;gap:11px;padding:6px 8px}
.tf-su-name{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-su-role{font-size:.74rem;color:rgba(245,241,232,.55)}
.tf-scrim{display:none}

.tf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tf-topbar{
  position:sticky;top:0;z-index:30;height:var(--topbar-h);
  background:rgba(240,234,221,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 clamp(18px,3vw,38px);
}
.tf-page-title{font-family:var(--serif);font-weight:500;font-size:1.22rem;letter-spacing:-.01em}
.tf-burger{display:none;background:none;border:none;cursor:pointer;color:var(--ink);padding:4px}
.tf-topsearch{
  display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 13px;width:240px;
}
.tf-topsearch input{border:none;background:none;outline:none;font-size:.88rem;width:100%}
.tf-icon-btn{
  width:40px;height:40px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-soft);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;position:relative;
  transition:border-color .18s,color .18s;flex-shrink:0;
}
.tf-icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.tf-bell .tf-dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface)}
.tf-content{padding:clamp(20px,3vw,36px);max-width:1280px;width:100%;margin:0 auto;flex:1}
.tf-foot{margin-top:42px;padding-top:22px;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-mute)}

/* ---------- PRIMITIVES ---------- */
.tf-stack{display:flex;flex-direction:column;gap:22px}
.tf-tag{
  display:inline-flex;align-items:center;gap:10px;font-size:.72rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent-ink);font-weight:600;
}
.tf-tag::before{content:"";width:24px;height:1px;background:var(--accent)}
.tf-card{box-shadow:var(--shadow-sm)}
.tf-card-hover{transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.tf-card-hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.tf-card-title{font-family:var(--serif);font-weight:500;font-size:1.12rem;letter-spacing:-.01em}
.tf-card-sub{font-size:.82rem;color:var(--ink-mute);margin-top:2px}
.tf-link{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;
  color:var(--pine);font-weight:600;font-size:.85rem;padding:0;transition:gap .2s;
}
.tf-link:hover{gap:9px}
.tf-row-hover{transition:background .15s}
.tf-row-hover:hover{background:var(--surface-2)}

/* grids */
.tf-grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tf-grid-2-1{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
.tf-grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}

/* search + selects */
.tf-search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px}
.tf-search input{border:none;background:none;outline:none;font-size:.9rem;width:100%}
.tf-select-wrap{position:relative;display:flex;align-items:center}
.tf-select-wrap select{
  appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:10px 38px 10px 14px;font-size:.86rem;cursor:pointer;outline:none;
}
.tf-select-wrap select:focus{border-color:var(--pine)}
.tf-select-wrap svg{position:absolute;right:12px;pointer-events:none;color:var(--ink-mute)}
.tf-viewtoggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tf-viewtoggle button{background:var(--surface);border:none;padding:9px 12px;cursor:pointer;color:var(--ink-mute);display:flex}
.tf-viewtoggle button.on{background:var(--pine);color:#f5f1e8}
.tf-chip{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:7px 15px;font-size:.83rem;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .16s;
}
.tf-chip:hover{border-color:var(--line-strong)}
.tf-chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}

/* detail */
.tf-detail-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.tf-detail-side{position:sticky;top:calc(var(--topbar-h) + 18px)}
.tf-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tf-fact{background:var(--surface);padding:14px 16px}
.tf-fact-k{font-size:.74rem;color:var(--ink-mute)}
.tf-fact-v{font-family:var(--serif);font-size:1.05rem;margin-top:2px}

/* stepper / valuation */
.tf-stepper{display:flex;gap:8px;flex-wrap:wrap}
.tf-step{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.82rem;color:var(--ink-mute);font-weight:500}
.tf-step-dot{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--ink-mute);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600;font-family:var(--serif)}
.tf-step.on{border-color:var(--pine);color:var(--ink)}
.tf-step.on .tf-step-dot{background:var(--pine);color:#f5f1e8}
.tf-step.done .tf-step-dot{background:var(--accent);color:#fff}
.tf-step.done{color:var(--ink-soft)}
.tf-step-title{font-family:var(--serif);font-weight:500;font-size:1.4rem;letter-spacing:-.01em}
.tf-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tf-field{display:flex;flex-direction:column;gap:7px}
.tf-field-label{font-size:.82rem;font-weight:500;color:var(--ink-soft)}
.tf-input{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:12px 14px;font-size:.95rem;outline:none;transition:border-color .18s}
.tf-input:focus{border-color:var(--pine)}
.tf-hint{margin-top:18px;font-size:.82rem;color:var(--ink-mute);line-height:1.6}
.tf-cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-cat-card{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:all .16s}
.tf-cat-card:hover{border-color:var(--line-strong)}
.tf-cat-card.on{border-color:var(--pine);background:rgba(13,79,74,.04)}
.tf-cat-label{font-family:var(--serif);font-weight:500;font-size:1.1rem}
.tf-cat-desc{font-size:.82rem;color:var(--ink-mute)}
.tf-seg{display:flex;gap:6px;flex-wrap:wrap}
.tf-seg button{flex:1;min-width:54px;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:11px 10px;font-size:.86rem;font-weight:500;cursor:pointer;color:var(--ink-soft);transition:all .16s}
.tf-seg button:hover{border-color:var(--pine)}
.tf-seg button.on{background:var(--pine);color:#f5f1e8;border-color:var(--pine)}

/* kanban */
.tf-kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.tf-kan-col{background:var(--surface-2);border-radius:14px;padding:12px;min-height:120px}
.tf-kan-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 12px;font-size:.84rem;font-weight:600;color:var(--ink-soft)}
.tf-kan-body{display:flex;flex-direction:column;gap:10px}
.tf-kan-card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .16s,box-shadow .16s}
.tf-kan-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.tf-kan-empty{text-align:center;color:var(--ink-mute);padding:18px;font-size:.85rem}
.tf-kan-moves{display:flex;gap:5px}
.tf-kan-moves button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;transition:all .14s}
.tf-kan-moves button:hover:not(:disabled){border-color:var(--pine);color:var(--pine)}
.tf-kan-moves button:disabled{opacity:.3;cursor:default}

/* drawer */
.tf-drawer-scrim{position:fixed;inset:0;background:rgba(20,32,30,.4);z-index:80;display:flex;justify-content:flex-end;animation:tf-fade .2s ease}
.tf-drawer{width:min(420px,92vw);background:var(--canvas);height:100%;overflow-y:auto;padding:26px;box-shadow:-10px 0 40px -10px rgba(0,0,0,.3);animation:tf-slide .26s cubic-bezier(.2,.7,.2,1)}
@keyframes tf-fade{from{opacity:0}to{opacity:1}}
@keyframes tf-slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1080px){
  .tf-grid-2-1{grid-template-columns:1fr}
  .tf-detail-grid{grid-template-columns:1fr}
  .tf-detail-side{position:static}
  .tf-kanban{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:880px){
  .tf-sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);box-shadow:var(--shadow-md)}
  .tf-sidebar.open{transform:none}
  .tf-scrim{display:block;position:fixed;inset:0;background:rgba(20,32,30,.4);z-index:35}
  .tf-burger{display:flex}
  .tf-grid-kpi{grid-template-columns:repeat(2,1fr)}
  .tf-topsearch{display:none}
}
@media(max-width:560px){
  .tf-facts{grid-template-columns:1fr 1fr}
  .tf-form-grid,.tf-cat-grid{grid-template-columns:1fr}
  .tf-kanban{grid-template-columns:1fr}
  .tf-page-title{font-size:1.05rem}
}
</style>
</head>
